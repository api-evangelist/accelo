aid: accelo
name: Accelo
description: >-
  Accelo is a cloud-based service operations automation (ServOps) platform that
  unifies project management, client relationship management (CRM), time
  tracking, retainers, quotes, billing, and invoicing for professional services
  businesses. The Accelo REST API exposes resources such as companies, contacts,
  activities, tasks, jobs (projects), milestones, invoices, contracts, and
  webhooks using OAuth 2.0 authentication scoped to a deployment subdomain.
