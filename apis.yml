apis:
  - aid: accelo:accelo-api
    name: Accelo REST API
    description: >-
      REST API for Accelo with CRUD access to companies, contacts, activities,
      tasks, projects (jobs), milestones, invoices, contracts, quotes,
      prospects, time entries, staff, and webhooks. Uses OAuth 2.0 (service,
      web, and installed application grants) with a Bearer access token and
      deployment-scoped subdomain.
    humanURL: https://api.accelo.com/docs/
    baseURL: https://{deployment}.api.accelo.com/api/v0
    tags:
